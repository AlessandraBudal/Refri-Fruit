<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Refri Store</title>
</head>

<body>
    <main>
        <div class="item active" style="--background: #EA3D41">
            <video class="fumaca" autoplay loop muted playsinline >
                <source src="./video/orange_flame.mp4" type="video/mp4">
            </video>
            <div class="tittle">Strawberry</div>
            <img src="./img/Morango-refrigerante-foregroundBlur.png" class="fruit">
            <img src="./img/Morango-refrigerante.png" class="refri">
            <p class="descricao">Doce na medida certa, efervescente em cada gole.</p>
        </div>
        <div class="item" style="--background: #2D5643">
            <video class="fumaca" autoplay loop muted playsinline>
                <source src="./video/orange_flame.mp4" type="video/mp4">
            </video>
            <div class="tittle">Avocado</div>
            <img src="./img/Abacate-refrigerante-foregroundBlur.png" class="fruit">
            <img src="./img/Abacate-refrigerante.png" class="refri">
            <p class="descricao">A cremosidade surpreendente do abacate em uma versão leve e com gás.</p>
        </div>
        <div class="item" style="--background: #E7A043">
            <video class="fumaca" autoplay loop muted playsinline>
                <source src="./video/orange_flame.mp4" type="video/mp4">
            </video>
            <div class="tittle">Orange</div>
            <img src="./img/Laranja-refrigerante-foregroundBlur.png" class="fruit">
            <img src="./img/Laranja-refrigerante.png" class="refri">
            <p class="descricao">Uma explosão cítrica e borbulhante de pura energia.</p>
        </div>
         <div class="gota">
            <img src="./img/gotas.png">
           
        </div>

        <div class="arrow">
            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>
    </main>

</body>
<script src="./script.js"></script>

</html>
